name: Starter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate JSON samples
        run: |
          python -m compileall functions scripts
          python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('contracts').glob('*.json')]"
      - name: Check measurement semantics
        run: python scripts/smoke_benchmark.py
      - name: Check benchmark shutdown and active request draining
        run: python -m unittest discover -s scripts -p 'test_benchmark_shutdown.py'
      - name: Lambda benchmark contract and HTTP parity tests
        run: python -m unittest discover -s functions/lambda_benchmark/tests -v
      - name: Install Lambda verification tooling
        run: python -m pip install -r infra/lambda/requirements-tools.txt
      - name: Lambda signed-tool tests and SAM template lint
        run: |
          python -m unittest discover -s infra/lambda/tests -v
          cfn-lint infra/lambda/template.yaml
      - name: Test evaluation harness
        run: python -m unittest evaluation.tests.test_evaluation evaluation.tests.test_lambda
      - name: Scheduler tests
        working-directory: scheduler
        run: python -m unittest discover -s tests -t .
      - name: Telemetry tests
        working-directory: telemetry
        run: python -m unittest discover -s tests -t .
      - name: Predictor tests
        run: python -m unittest discover -s predictor/test -t .
      - name: Build benchmark image
        run: docker build -t csc3104-benchmark:ci functions/benchmark
      - name: Verify container PID 1 exits on SIGTERM
        run: python scripts/check_container_shutdown.py --image csc3104-benchmark:ci --output results/shutdown/ci.json
