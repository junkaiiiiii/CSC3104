apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: periodic
  namespace: csc3104
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "4"
    spec:
      containerConcurrency: 1
      containers:
        - image: ghcr.io/junkaiiiiii/csc3104-benchmark@sha256:08b3dc54461c0687c76e867a71b7c11955d7c1580133a89ad02ebb3fc5904c4e
          ports:
            - containerPort: 8080
          env:
            - name: FUNCTION_ID
              value: periodic
            - name: INIT_DELAY_MS
              value: "0"
            - name: WORK_DELAY_MS
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz